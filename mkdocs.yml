site_name: fastapi-viewsets
site_description: DRF-style ViewSets for FastAPI — auto-generate CRUD endpoints from SQLAlchemy, Tortoise ORM, or Peewee models in minutes.
site_url: https://svalench.github.io/fastapi_viewsets/
repo_url: https://github.com/svalench/fastapi_viewsets
repo_name: svalench/fastapi_viewsets
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/rocket-launch

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started.md
    - Sync Quickstart: quickstart-sync.md
    - Async Quickstart: quickstart-async.md
  - Guides:
    - ORM Adapters: orm-adapters.md
    - Eager Loading: eager-loading.md
    - Overriding Handlers: overrides.md
    - Authentication: authentication.md
    - Pagination & Filtering: pagination-filtering.md
    - Custom Routes: custom-routes.md
  - Reference:
    - API Reference: api-reference.md
    - Comparison: comparison.md
    - Changelog: changelog.md

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/svalench/fastapi_viewsets
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-viewsets/

extra_css:
  - assets/custom.css
