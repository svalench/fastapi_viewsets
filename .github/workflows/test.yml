name: Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=fastapi_viewsets --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=70

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.11'
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  # Exercise the ORM adapters (Tortoise/Peewee) on the newest supported
  # Python. The main matrix only installs the [test] extra, so adapter
  # tests are skipped there — this job makes sure they actually run.
  test-extras:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,tortoise,peewee]"

    - name: Run tests
      run: |
        pytest tests/ -v --cov=fastapi_viewsets --cov-report=term-missing --cov-fail-under=70

  package:
    name: Build and test installed wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build sdist and wheel
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*

    - name: Install wheel with the minimum SQLAlchemy version
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install dist/*.whl pytest pytest-asyncio httpx "SQLAlchemy==2.0.0"
        .venv/bin/python -m pip check
        .venv/bin/python -I -c "from fastapi_viewsets import BaseViewset, AsyncBaseViewset"

    - name: Exercise sync quickstarts without an async driver
      run: |
        .venv/bin/python -m pytest --noconftest -o addopts= tests/test_quickstarts.py -k "not async"

    - name: Exercise all quickstarts with SQLite async support
      run: |
        .venv/bin/python -m pip install aiosqlite
        .venv/bin/python -m pytest --noconftest -o addopts= tests/test_quickstarts.py
