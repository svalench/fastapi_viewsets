name: Publish to PyPI (Manual with Token)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.6)'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify requested version matches pyproject.toml
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        python - <<'PY'
        import os
        import tomllib
        from pathlib import Path

        requested = os.environ["REQUESTED_VERSION"].removeprefix("v")
        actual = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        if requested != actual:
            raise SystemExit(
                f"Requested version {requested!r} does not match pyproject.toml ({actual}). "
                "Update pyproject.toml before publishing."
            )
        PY

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
